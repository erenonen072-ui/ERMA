
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>ERENSARYA - Sosyal Video</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="header">
  <a class="logo" href="#">EREN<span>SARYA</span></a>
  <div class="header-actions">
    <button id="searchBtn" class="icon-btn">⌕</button>
    <button id="messagesBtn" class="icon-btn message-open">
      ✉
      <span id="messageBadge" class="message-badge hidden">0</span>
    </button>
  </div>
</header>

<div class="auth-bar" id="authBar">
  <button onclick="showAuth('login')">Giriş Yap</button>
  <button class="dark-btn" onclick="showAuth('signup')">Kayıt Ol</button>
</div>

<nav class="tabs">
  <button onclick="loadFeed('following',this)">Takip</button>
  <button class="active" onclick="loadFeed('forYou',this)">Sana Özel</button>
  <button onclick="loadFeed('discover',this)">Keşfet</button>
</nav>

<main id="feed">
  <div class="loading">Videolar yükleniyor...</div>
</main>

<section id="profilePage" class="profile-page hidden"></section>

<!-- MESAJLAŞMA SAYFASI -->
<section id="messagesPage" class="messages-page hidden">
  <div class="messages-topbar">
    <button id="backMessages" class="back-btn">←</button>
    <div>
      <h2>Mesajlar</h2>
      <p>ERENSARYA özel sohbet</p>
    </div>
  </div>

  <div class="messages-layout">
  <aside class="messages-sidebar er-contact-panel">
      <div class="contact-search">
        <span>⌕</span>
        <input id="contactSearch" placeholder="Kullanıcı ara...">
      </div>
      <div id="contactList" class="contact-list">
        <p class="chat-empty">Kullanıcılar yükleniyor...</p>
      </div>
    </aside>

    <div class="chat-panel er-chat-panel">
      <div id="chatHeader" class="chat-header">
        <div class="chat-welcome-icon">✉</div>
        <h3>ERENSARYA Mesajlaşma</h3>
        <p>Sohbet etmek için bir kullanıcı seç.</p>
      </div>

      <div id="messageList" class="message-list">
        <div class="chat-start">
          <div class="chat-start-icon">💬</div>
          <h3>Sohbete başla</h3>
          <p>Bir kullanıcı seçerek mesajlaşmaya başlayabilirsin.</p>
        </div>
      </div>

      <form id="messageForm" class="message-form">
        <input
          id="messageInput"
          maxlength="2000"
          placeholder="Önce bir sohbet seç..."
          autocomplete="off"
          disabled
          required
        >
        <button type="submit" disabled id="sendMessageBtn">➤</button>
      </form>
    </div>
  </div>
</section>

<!-- GİRİŞ / KAYIT -->
<div id="authModal" class="modal hidden">
  <div class="modal-content">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="authTitle">ERENSARYA</h2>
    <form id="authForm">
      <input id="username" placeholder="Kullanıcı adı" maxlength="30">
      <input id="email" type="email" placeholder="E-posta" required>
      <input id="password" type="password" placeholder="Şifre" minlength="8" required>
      <button class="dark-btn" type="submit" id="authSubmit">Devam Et</button>
    </form>
    <p id="authMessage"></p>
  </div>
</div>

<!-- YORUMLAR -->
<div id="commentModal" class="modal hidden">
  <div class="modal-content">
    <button class="close" onclick="closeComments()">✕</button>
    <h2>Yorumlar</h2>
    <div id="commentList"></div>
    <form id="commentForm">
      <input id="commentInput" placeholder="Yorum yaz..." maxlength="500" required>
      <button class="dark-btn">Gönder</button>
    </form>
  </div>
</div>

<input type="file" id="videoInput"
  accept="video/mp4,video/webm,video/quicktime" hidden>

<nav class="bottom-nav">
  <button onclick="loadFeed('forYou')">⌂<small>Ana Sayfa</small></button>
  <button onclick="loadFeed('following')">♧<small>Takip</small></button>
  <button class="upload-btn" onclick="uploadVideo()">＋</button>
  <button onclick="loadFeed('discover')">⌕<small>Keşfet</small></button>
  <button onclick="showMyProfile()">♙<small>Profil</small></button>
</nav>

<script src="app.js"></script>
<script src="messages.js"></script>

</body>
</html>
